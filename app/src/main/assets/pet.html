<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ghost</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  svg { width:100%; height:100%; }

  .bubble {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.92);
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 10px;
    font-family: sans-serif;
    color: #444;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .bubble.show { opacity: 1; }

  @keyframes handWave {
    0%,100% { transform: rotate(0deg); }
    25% { transform: rotate(-15deg); }
    75% { transform: rotate(15deg); }
  }
  @keyframes handHide {
    0%,100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
</style>
</head>
<body>

<div class="bubble" id="bubble"></div>

<svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ghostGrad" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8e8f0" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- body -->
  <path id="ghostBody" d="
    M20 72
    Q20 72 18 65 Q15 50 18 35 Q20 15 40 10 Q60 15 62 35 Q65 50 62 65 Q60 72 60 72
    Q56 66 52 72 Q48 66 44 72 Q40 66 36 72 Q32 66 28 72 Q24 66 20 72
    Z
  " fill="url(#ghostGrad)" stroke="rgba(180,180,210,0.5)" stroke-width="0.8"/>

  <!-- hands -->
  <ellipse id="lHand" cx="18" cy="55" rx="5" ry="4.5" fill="#f0f0fa" stroke="rgba(180,180,210,0.4)" stroke-width="0.5"/>
  <ellipse id="rHand" cx="62" cy="55" rx="5" ry="4.5" fill="#f0f0fa" stroke="rgba(180,180,210,0.4)" stroke-width="0.5"/>

  <!-- eyebrows -->
  <line id="lBrow" x1="27" y1="31" x2="37" y2="31" stroke="#555" stroke-width="1.2" stroke-linecap="round" opacity="0"/>
  <line id="rBrow" x1="43" y1="31" x2="53" y2="31" stroke="#555" stroke-width="1.2" stroke-linecap="round" opacity="0"/>

  <!-- eyes -->
  <ellipse id="lEye" cx="32" cy="38" rx="5" ry="6" fill="#333"/>
  <ellipse id="rEye" cx="48" cy="38" rx="5" ry="6" fill="#333"/>

  <!-- eye highlights -->
  <ellipse id="lHighlight" cx="33" cy="36" rx="1.5" ry="2" fill="white" opacity="0.8"/>
  <ellipse id="rHighlight" cx="49" cy="36" rx="1.5" ry="2" fill="white" opacity="0.8"/>

  <!-- mouth -->
  <path id="mouth" d="M38 48 Q40 50 42 48" fill="none" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse id="lBlush" cx="25" cy="44" rx="4" ry="2.5" fill="#FFB6C1" opacity="0.4"/>
  <ellipse id="rBlush" cx="55" cy="44" rx="4" ry="2.5" fill="#FFB6C1" opacity="0.4"/>
</svg>

<script>
  const SUPABASE_URL = "https://wsqucjvfcwigoicgznzd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_QBHO2jRjZ02lhETBZxhmOQ_JX3geUdm";

  const $ = id => document.getElementById(id);
  const bubble = $('bubble');
  const mouth = $('mouth');
  const lEye = $('lEye'), rEye = $('rEye');
  const lBrow = $('lBrow'), rBrow = $('rBrow');
  const lBlush = $('lBlush'), rBlush = $('rBlush');
  const lHand = $('lHand'), rHand = $('rHand');
  const lHighlight = $('lHighlight'), rHighlight = $('rHighlight');
  const svg = document.querySelector('svg');

  let lastStateId = null;
  let bubbleTimer = null;
  let currentMood = 'neutral';
  let floatPhase = 0;
  let lastHour = -1;

  // ========== FLOAT ANIMATION ==========
  setInterval(() => {
    floatPhase += 0.03;
    svg.style.transform = `translateY(${Math.sin(floatPhase)*3}px)`;
  }, 30);

  // ========== PET ENGINE API ==========
  window.petEngine = {
    onTap() {
      if (currentMood === 'sleepy') {
        setMood('surprised');
        say('哇！');
        bounce();
        setTimeout(() => setMood('sleepy'), 2000);
      } else {
        setMood('happy');
        say('boo!');
        bounce();
        setTimeout(() => setMood('neutral'), 2000);
      }
    },
    onDoubleTap() {
      setMood('surprised');
      say('boo boo!!');
      wiggle();
      setTimeout(() => setMood('neutral'), 2500);
    },
    onLongPress() {
      setMood('sleepy');
      say('zzz…');
    },
    onDragStart() {
      setMood('surprised');
      say('诶？');
    },
    onDragEnd() {
      setMood('shy');
      say('呼…');
      setTimeout(() => setMood('neutral'), 2500);
    },
    onScreenshot() {
      setMood('surprised');
      say('咔嚓！');
      flash();
      setTimeout(() => setMood('neutral'), 2000);
    },
    onBatteryLow() {
      setMood('sleepy');
      say('好困…💤');
    },
    onCharging() {
      setMood('happy');
      say('吃饱了！⚡');
      setTimeout(() => setMood('neutral'), 2000);
    }
  };

  // ========== GESTURE ACTIONS ==========
  function bounce() {
    svg.style.transition = 'transform 0.12s cubic-bezier(.36,.07,.19,.97)';
    svg.style.transform = 'translateY(-12px) scale(1.1,0.9)';
    setTimeout(() => { svg.style.transform = ''; }, 120);
  }

  function wiggle() {
    let c = 0;
    const iv = setInterval(() => {
      svg.style.transform = `rotate(${c%2===0?-10:10}deg)`;
      if (++c>10) { clearInterval(iv); svg.style.transform = ''; }
    }, 30);
  }

  function flash() {
    const body = $('ghostBody');
    body.setAttribute('fill', '#ffffcc');
    setTimeout(() => body.setAttribute('fill', 'url(#ghostGrad)'), 150);
  }

  // ========== SIX MOODS ==========
  function setMood(mood) {
    currentMood = mood;
    // reset
    lBrow.setAttribute('opacity', '0');
    rBrow.setAttribute('opacity', '0');
    lBlush.setAttribute('opacity', '0.4');
    rBlush.setAttribute('opacity', '0.4');
    lHand.style.transform = '';
    rHand.style.transform = '';
    lHighlight.setAttribute('opacity', '0.8');
    rHighlight.setAttribute('opacity', '0.8');

    switch(mood) {
      case 'neutral':
        lEye.setAttribute('rx','5'); lEye.setAttribute('ry','6');
        rEye.setAttribute('rx','5'); rEye.setAttribute('ry','6');
        mouth.setAttribute('d','M38 48 Q40 50 42 48');
        break;

      case 'happy':
        lEye.setAttribute('rx','5'); lEye.setAttribute('ry','3');
        rEye.setAttribute('rx','5'); rEye.setAttribute('ry','3');
        mouth.setAttribute('d','M36 48 Q40 54 44 48');
        lBlush.setAttribute('opacity','0.7');
        rBlush.setAttribute('opacity','0.7');
        lHand.style.transform = 'rotate(-20deg)';
        rHand.style.transform = 'rotate(20deg)';
        break;

      case 'sleepy':
        lEye.setAttribute('rx','5'); lEye.setAttribute('ry','2.5');
        rEye.setAttribute('rx','5'); rEye.setAttribute('ry','2.5');
        mouth.setAttribute('d','M39 49 Q40 50 41 49');
        lHighlight.setAttribute('opacity','0');
        rHighlight.setAttribute('opacity','0');
        break;

      case 'surprised':
        lEye.setAttribute('rx','6'); lEye.setAttribute('ry','6');
        rEye.setAttribute('rx','6'); rEye.setAttribute('ry','6');
        mouth.setAttribute('d','M39 49 Q40 47 41 49');
        lHand.style.transform = 'translate(-3px,-4px)';
        rHand.style.transform = 'translate(3px,-4px)';
        break;

      case 'shy':
        lEye.setAttribute('rx','4'); lEye.setAttribute('ry','6');
        rEye.setAttribute('rx','4'); rEye.setAttribute('ry','6');
        mouth.setAttribute('d','M37 49 Q38 47 39 49 Q40 51 41 49 Q42 47 43 49');
        lBlush.setAttribute('opacity','0.85');
        rBlush.setAttribute('opacity','0.85');
        lHand.style.transform = 'translate(2px,3px)';
        rHand.style.transform = 'translate(-2px,3px)';
        break;

      case 'angry':
        lBrow.setAttribute('opacity','1');
        rBrow.setAttribute('opacity','1');
        lBrow.setAttribute('y1','29'); lBrow.setAttribute('y2','31');
        rBrow.setAttribute('y1','31'); rBrow.setAttribute('y2','29');
        lEye.setAttribute('rx','5'); lEye.setAttribute('ry','5');
        rEye.setAttribute('rx','5'); rEye.setAttribute('ry','5');
        mouth.setAttribute('d','M37 51 Q40 48 43 51');
        lBlush.setAttribute('opacity','0.6');
        rBlush.setAttribute('opacity','0.6');
        lBlush.setAttribute('fill','#FF9999');
        rBlush.setAttribute('fill','#FF9999');
        break;

      case 'wink':
        lEye.setAttribute('rx','5'); lEye.setAttribute('ry','1.5');
        rEye.setAttribute('rx','5'); rEye.setAttribute('ry','6');
        mouth.setAttribute('d','M37 48 Q40 52 44 47');
        lHand.style.transform = 'rotate(-25deg)';
        break;
    }
  }

  // ========== BUBBLE ==========
  function say(text) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 2000);
  }

  // ========== TIME AWARENESS ==========
  function checkTime() {
    const h = new Date().getHours();
    if (h === lastHour) return;
    lastHour = h;

    if (h >= 22 || h < 5) {
      setMood('sleepy');
      say('夜深了…');
    } else if (h >= 5 && h < 8) {
      setMood('sleepy');
      say('早安…☀️');
    } else if (h >= 8 && h < 12) {
      setMood('happy');
      say('新的一天！');
    } else if (h >= 12 && h < 14) {
      setMood('happy');
      say('午饭时间~');
    } else if (h >= 14 && h < 18) {
      setMood('wink');
      say('下午好呀');
    } else if (h >= 18 && h < 22) {
      setMood('wink');
      say('晚上好~');
    }
  }
  setInterval(checkTime, 30000);
  checkTime();

  // ========== SUPABASE POLLING ==========
  async function pollAI() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/pet_state?order=updated_at.desc&limit=1`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
      );
      const data = await res.json();
      if (data.length>0 && data[0].id!==lastStateId) {
        lastStateId=data[0].id;
        const {state_key,state_value}=data[0];
        switch(state_key) {
          case 'mood': setMood(state_value); break;
          case 'speech': say(state_value); break;
        }
      }
    } catch(_) {}
  }
  setInterval(pollAI, 15000);
  pollAI();
</script>
</body>
</html>
