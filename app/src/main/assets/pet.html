<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ghost</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  svg { width:100%; height:100%; }

  .bubble {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 10px;
    font-family: sans-serif;
    color: #444;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .bubble.show { opacity: 1; }
</style>
</head>
<body>

<div class="bubble" id="bubble"></div>

<svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ghostGrad" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8e8f0" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <path id="ghostBody" d="
    M20 72
    Q20 72 18 65 Q15 50 18 35 Q20 15 40 10 Q60 15 62 35 Q65 50 62 65 Q60 72 60 72
    Q56 66 52 72 Q48 66 44 72 Q40 66 36 72 Q32 66 28 72 Q24 66 20 72
    Z
  " fill="url(#ghostGrad)" stroke="rgba(180,180,210,0.5)" stroke-width="0.8"/>

  <ellipse id="lEye" cx="32" cy="38" rx="5" ry="6" fill="#333"/>
  <ellipse id="rEye" cx="48" cy="38" rx="5" ry="6" fill="#333"/>

  <ellipse cx="33" cy="36" rx="1.5" ry="2" fill="white" opacity="0.8"/>
  <ellipse cx="49" cy="36" rx="1.5" ry="2" fill="white" opacity="0.8"/>

  <path id="mouth" d="M38 48 Q40 50 42 48" fill="none" stroke="#555" stroke-width="1.2" stroke-linecap="round"/>

  <ellipse cx="26" cy="44" rx="4" ry="2.5" fill="#FFB6C1" opacity="0.5"/>
  <ellipse cx="54" cy="44" rx="4" ry="2.5" fill="#FFB6C1" opacity="0.5"/>
</svg>

<script>
  const SUPABASE_URL = "https://wsqucjvfcwigoicgznzd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_z_p7qNpYNSt2F5JC8J5Yiw_CrMhhbT3";

  const bubble = document.getElementById('bubble');
  const mouth = document.getElementById('mouth');
  const lEye = document.getElementById('lEye');
  const rEye = document.getElementById('rEye');

  let lastStateId = null;
  let bubbleTimer = null;

  let floatPhase = 0;
  setInterval(() => {
    floatPhase += 0.03;
    document.querySelector('svg').style.transform = 
      `translateY(${Math.sin(floatPhase)*3}px)`;
  }, 30);

  window.petEngine = {
    onTap()       { say("boo!"); bounce(); },
    onDoubleTap() { say("boo boo!"); wiggle(); },
    onLongPress() { say("zzz…"); setMood("sleepy"); }
  };

  function bounce() {
    const s = document.querySelector('svg');
    s.style.transition = 'transform 0.12s cubic-bezier(.36,.07,.19,.97)';
    s.style.transform = 'translateY(-12px) scale(1.1,0.9)';
    setTimeout(() => { s.style.transform = ''; }, 120);
  }

  function wiggle() {
    const s = document.querySelector('svg');
    let c = 0;
    const iv = setInterval(() => {
      s.style.transform = `rotate(${c%2===0?-8:8}deg)`;
      if (++c>8) { clearInterval(iv); s.style.transform = ''; }
    }, 35);
  }

  function setMood(mood) {
    switch(mood) {
      case 'happy':
        mouth.setAttribute('d', 'M37 48 Q40 53 43 48');
        lEye.setAttribute('ry','4');
        rEye.setAttribute('ry','4');
        break;
      case 'sleepy':
        mouth.setAttribute('d', 'M39 48 Q40 49 41 48');
        lEye.setAttribute('ry','3');
        rEye.setAttribute('ry','3');
        break;
      default:
        mouth.setAttribute('d', 'M38 48 Q40 50 42 48');
        lEye.setAttribute('ry','6');
        rEye.setAttribute('ry','6');
    }
  }

  function say(text) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 2000);
  }

  async function pollAI() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/pet_state?order=updated_at.desc&limit=1`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
      );
      const data = await res.json();
      if (data.length>0 && data[0].id!==lastStateId) {
        lastStateId=data[0].id;
        const {state_key,state_value}=data[0];
        switch(state_key) {
          case 'mood': setMood(state_value); break;
          case 'speech': say(state_value); break;
        }
      }
    } catch(_) {}
  }

  setInterval(pollAI, 15000);
  pollAI();
</script>
</body>
</html>
